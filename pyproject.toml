[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-examiner"
version = "0.1.0"
description = "Deterministic English proposal checks with revision memory"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["local_examiner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
